name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and test
        run: |
          set +e
          gradle assembleDebug testDebugUnitTest --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 140 build.log
          exit $code

      - name: Report compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          grep -nE "error:|FAILED|Exception|Caused by|at com.arena" build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          {
            echo "Automated build log (head 60 + tail 90)"
            echo '```'
            head -n 60 build.log
            echo '...'
            tail -n 90 build.log
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" > /dev/null || echo "comment post failed"

      - name: Publish screenshots
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for f in app/build/screenshots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/screenshots/${name}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null)
            mkdir -p docs/screenshots
            cp "$f" "docs/screenshots/${name}"
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/docs/screenshots/${name}" \
                -f message="docs: update ${name}" -f content="$(base64 -w0 "$f")" \
                -f branch="${GITHUB_REF_NAME}" -f sha="$sha" > /dev/null && echo "updated ${name}"
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/docs/screenshots/${name}" \
                -f message="docs: add ${name}" -f content="$(base64 -w0 "$f")" \
                -f branch="${GITHUB_REF_NAME}" > /dev/null && echo "added ${name}"
            fi
          done

      - name: Summarize build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build OK \`${GITHUB_SHA:0:7}\`"
            echo '```'
            grep -E "BUILD SUCCESSFUL|PASSED|FAILED|tests completed" build.log | head -20
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print $5, $9}'
            echo '```'
          } > /tmp/summary.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/summary.md)" > /dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stick-duelist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publishes the APK as a public release asset so it can be installed
      # straight from a phone without a GitHub login.
      - name: Publish installable APK
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="stick-duelist-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$APK" \
            --title "Stick Duelist build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from \`${GITHUB_SHA}\" on ${GITHUB_REF_NAME}. Install on Android 7.0+ (allow unknown sources)." \
            --latest
