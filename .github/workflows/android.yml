name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - 'docs/screenshots/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and test
        run: |
          set +e
          gradle assembleDebug testDebugUnitTest --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 140 build.log
          exit $code

      - name: Report compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          grep -nE "error:|FAILED|Exception|Caused by|at com.arena" build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          {
            echo "Automated build log (head 60 + tail 90)"
            echo '```'
            head -n 60 build.log
            echo '...'
            tail -n 90 build.log
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" > /dev/null || echo "comment post failed"

      - name: Publish screenshots
        if: success() && github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          files=(app/build/screenshots/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no screenshots produced"
            exit 0
          fi
          mkdir -p docs/screenshots
          cp "${files[@]}" docs/screenshots/
          git config user.name "duelist-bot"
          git config user.email "duelist-bot@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi
          git commit -m "docs: refresh screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarize build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build OK \`${GITHUB_SHA:0:7}\`"
            echo '```'
            grep -E "BUILD SUCCESSFUL|PASSED|FAILED|tests completed" build.log | head -20
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print $5, $9}'
            echo '```'
            echo "screenshots:"
            ls -la app/build/screenshots 2>&1 | head -15
          } > /tmp/summary.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/summary.md)" > /dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stick-duelist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publishes the APK as a public release asset so it can be installed
      # straight from a phone without a GitHub login.
      - name: Publish installable APK
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="stick-duelist-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$APK" \
            --title "Stick Duelist build ${GITHUB_RUN_NUMBER}" \
            --target "${GITHUB_SHA}" \
            --notes "Debug APK built from \`${GITHUB_SHA}\" on ${GITHUB_REF_NAME}. Install on Android 7.0+ (allow unknown sources)." \
            --latest
