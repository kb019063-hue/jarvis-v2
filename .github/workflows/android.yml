name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 120 build.log
          exit $code

      - name: Report compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          grep -nE "error:|error: |e: " build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          {
            echo "Automated build log (head 60 + tail 90)"
            echo '```'
            head -n 60 build.log
            echo '...'
            tail -n 90 build.log
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" > /dev/null || echo "comment post failed"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stick-duelist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
