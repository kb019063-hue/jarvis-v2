name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and test
        run: |
          set +e
          gradle assembleDebug testDebugUnitTest --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 140 build.log
          exit $code

      - name: Report compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          grep -nE "error:|FAILED|Exception|Caused by|at com.arena" build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          {
            echo "Automated build log (head 60 + tail 90)"
            echo '```'
            head -n 60 build.log
            echo '...'
            tail -n 90 build.log
            echo '```'
          } > /tmp/body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/body.md)" > /dev/null || echo "comment post failed"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stick-duelist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publishes the APK as a public release asset so it can be installed
      # straight from a phone without a GitHub login.
      - name: Publish installable APK
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="stick-duelist-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$APK" \
            --title "Stick Duelist build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from \`${GITHUB_SHA}\" on ${GITHUB_REF_NAME}. Install on Android 7.0+ (allow unknown sources)." \
            --latest
