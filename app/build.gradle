plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arena.duelist'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arena.duelist'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
